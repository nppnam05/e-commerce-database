# Flyway Configuration for PHF Database
# ======================================

# Migration locations - Organized by schema
# Each schema has structure/ and data/ subfolders
flyway.locations=filesystem:migrations/identity/structure,filesystem:migrations/identity/data,filesystem:migrations/sales/structure,filesystem:migrations/sales/data,filesystem:migrations/inventories/structure,filesystem:migrations/inventories/data

# Alternative simpler config (if you want all):
# flyway.locations=filesystem:migrations

# Schema history table
flyway.table=schema_version

# Validation settings
flyway.validateOnMigrate=true

# Out of Order Migrations
# IMPORTANT: Set to true because we use version ranges by schema:
# - Identity:     V0001-V0999
# - Sales:        V1000-V1999
# - Inventories:  V2000-V2999
# This allows parallel development where Sales team might merge V1000
# before Identity team merges V0050, and both will work correctly.
flyway.outOfOrder=true
# flyway.ignoreMissingMigrations=false  # Not available in Community Edition

# Encoding for SQL files
flyway.encoding=UTF-8

# Placeholders (if needed)
flyway.placeholderReplacement=false

# Mixed mode (allows running both versioned and repeatable migrations)
flyway.mixed=false

# Clean disabled for safety (never use in production)
flyway.cleanDisabled=false

